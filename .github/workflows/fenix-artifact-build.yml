# ------------------------------------------------------------
# Firefox for Android【正式版】—— artifact（预编译产物）模式构建，不含签名
#
# 放到你自己【公开】仓库的 .github/workflows/ 下。仓库结构：
#   patches/*.patch     会被自动应用（补丁清单见 README）
#   optional/*.patch    不会被应用；想启用就挪到 patches/ 里
#
# 产物是【未签名】的 release APK（只有 arm64-v8a 一个），且不打成 zip：
# 构建完成后，在运行页面底部 Artifacts 里直接点 APK 文件名即可下载，然后在本地自己签名。
#
# 说明：
#  * 参数已对照 160.0 的源码核对过（bootstrap 取值、mozconfig、产物查找逻辑）。159.0.1 → 160.0 之间
#    artifacts.py / mozboot / gradle.configure 有改动，已逐个读过，没有影响这条流水线的；唯一的新东西是
#    160 的 bootstrap 会多装几个“agentic 编码工具”（按源码读，装不上只会打印提示，不会中断，但没实跑）。
#    补丁在 160.0 的 tag 上做过 `git apply` 和 Kotlin 语法检查，
#    但整条流水线没有完整跑通过，补丁也没有真正编译过。
#  * 公开仓库的标准 runner 是 4 核 / 16 GB，私有仓库只有 2 核 / 8 GB。
#    磁盘更紧张（空闲只有二三十 GB），所以下面有一步专门腾空间，并且会在构建时持续打印剩余空间。
#  * artifact 模式只能改 Java/Kotlin/资源/字符串/JS/CSS/FTL，不能改 C/C++/Rust。
#  * 本构建把所有 Kotlin 警告当作错误（上游约定），写补丁时要注意，详见 README。
#  * actions/checkout 的版本号请换成当前最新的大版本；
#    upload-artifact 需要 v7 及以上才支持 `archive: false`。
# ------------------------------------------------------------
name: Build Firefox for Android (release, unsigned)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游正式版 tag；出新版本后改成新的，例如 FIREFOX_161_0_RELEASE"
        default: "FIREFOX_160_0_RELEASE"

env:
  UPSTREAM: https://github.com/mozilla-firefox/firefox

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 取你自己仓库（patches/ 等）
        uses: actions/checkout@v4
        with:
          path: mine

      - name: 腾磁盘（标准 runner 的可用空间只有二三十 GB，不够用）
        run: |
          echo "== 清理前 =="; df -h / /mnt || true
          # 预装的 Android SDK/NDK 是最大的一块（十几 GB）。构建不需要它：bootstrap 会把自己用的 SDK
          # 装到 ~/.mozbuild，mach 运行 Gradle 时也会用那份覆盖 ANDROID_HOME，所以可以放心删
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/local/share/chromium /opt/az /opt/microsoft \
            /usr/lib/google-cloud-sdk || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          # 故意不删 swap（/mnt 上那个文件）：Gradle 吃内存，删了可能直接被系统杀掉，而且报错里看不出原因
          echo "== 清理后 =="; df -h / /mnt || true

          # 磁盘监视：包在耗时的命令外面，每 60 秒打印一次剩余空间。
          # 这样即使 runner 因磁盘写满而崩溃，已经输出的日志里也能看出空间是在哪一步被吃掉的
          cat > "$RUNNER_TEMP/dw" <<'EOF'
          #!/usr/bin/env bash
          # 用法：dw 命令 [参数...]
          ( while sleep 60; do
              printf '[磁盘] %s  %s\n' "$(date +%T)" "$(df -h / | awk 'NR==2 {print $4 " 可用，已用 " $5}')"
            done ) &
          watcher=$!
          "$@"
          rc=$?
          kill "$watcher" 2>/dev/null || true
          exit "$rc"
          EOF
          chmod +x "$RUNNER_TEMP/dw"

      - name: 浅克隆上游源码（只取该 tag 的这一个提交）
        env:
          # 兜底值要和上面 inputs.upstream_ref 的 default 保持一致（改版本时两处一起改）
          REF: ${{ inputs.upstream_ref || 'FIREFOX_160_0_RELEASE' }}
        run: |
          mkdir firefox && cd firefox
          git init -q
          git remote add origin "$UPSTREAM"
          git fetch --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD
          echo "Firefox 版本: $(cat browser/config/version.txt)"
          git log -1 --format='%H %s'
          # 把预编译产物的查找固定到这个提交：Mozilla 没为它编过就直接报错，
          # 而不是悄悄拿一个不匹配的版本凑合（源码与产物不一致会出难查的问题）
          echo "MOZ_ARTIFACT_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          df -h / | tail -1

      - name: 应用补丁
        working-directory: firefox
        run: |
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/mine/patches/*.patch)
          echo "共 ${#patches[@]} 个补丁"
          for p in "${patches[@]}"; do
            echo "apply $p"
            git apply --whitespace=nowarn "$p"
          done

      - name: bootstrap（Artifact Mode，不装 C++ 编译工具链）
        working-directory: firefox
        run: |
          "$RUNNER_TEMP/dw" ./mach --no-interactive bootstrap --application-choice=mobile_android_artifact_mode
          df -h / | tail -1

      - name: 写 mozconfig
        working-directory: firefox
        run: |
          # 目标架构：多数手机用 aarch64；其它架构请改 --target，并同步改下面 Gradle 步骤
          cat > mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64-linux-android
          ac_add_options --enable-artifact-builds
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/objdir-artifact
          EOF
          echo "MOZCONFIG=$PWD/mozconfig" >> "$GITHUB_ENV"

      - name: mach build（下载预编译产物并组装 GeckoView）
        working-directory: firefox
        run: |
          "$RUNNER_TEMP/dw" ./mach build
          df -h / | tail -1

      - name: 编译 Fenix（Release，未签名，仅 arm64）
        working-directory: firefox
        run: |
          # -PbenchmarkTest 在 Fenix 的 build.gradle 里只有一个作用：把 ABI 拆分限制为 arm64-v8a。
          # 不加的话会同时生成 armeabi-v7a / arm64-v8a / x86_64 三个 APK，而预编译产物只有 arm64，
          # 另外两个没法用，还会多花时间，也没法用“一次只能传一个文件”的方式单独上传。
          # 内存不够时可再加 -PdisableOptimization（关闭 R8 优化，APK 会变大）。
          "$RUNNER_TEMP/dw" ./mach gradle fenix:assembleRelease -PbenchmarkTest

      - name: 定位 APK（必须恰好 1 个）
        id: apk
        run: |
          set -e
          mapfile -t apks < <(find firefox/objdir-artifact/gradle/build/mobile/android/fenix \
            -path '*/outputs/apk/*' -name '*.apk')
          echo "找到 ${#apks[@]} 个 APK:"
          printf '  %s\n' "${apks[@]}"
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::期望恰好 1 个 APK，实际 ${#apks[@]} 个，请检查上一步 Gradle 的输出"
            exit 1
          fi
          mkdir -p out
          cp -v "${apks[0]}" out/
          echo "path=out/$(basename "${apks[0]}")" >> "$GITHUB_OUTPUT"

      - name: 上传 APK（不打包成 zip）
        uses: actions/upload-artifact@v7
        with:
          # archive: false 时一次只能传 1 个文件，artifact 的名字就是文件名（name 参数会被忽略）
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: 磁盘使用情况（排查用；失败时也会运行）
        if: ${{ !cancelled() }}
        run: |
          df -h / /mnt || true
          du -sh firefox firefox/objdir-artifact "$HOME/.mozbuild" "$HOME/.gradle" 2>/dev/null || true

# 跑通之后可以再加：
#  * actions/cache 缓存 ~/.gradle 和 ~/.mozbuild，加快后续构建
#  * 出新版本时自动提醒/触发（例如定时检查最新的 FIREFOX_*_RELEASE tag）
